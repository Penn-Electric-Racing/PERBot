name: Sponsorship — Hourly Stage Sync

# Stamps `Contacted at` on Pipeline deals that have moved out of Prospect (Contacted /
# In talks / Won) but weren't stamped yet — i.e. stage changes made in Notion rather than
# via /sponsor stage. This is the weekly quota audit's signal ("sponsors contacted").
# Once per deal, ever. Idempotent — only unstamped deals are written — so late/double
# cron fires are harmless.
on:
  schedule:
    - cron: '30 * * * *' # hourly, offset from the win-post job
  workflow_dispatch:

jobs:
  stage-sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sponsor-stage-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PERBot/package-lock.json

      - name: Install dependencies
        working-directory: PERBot
        run: npm ci

      - name: Stamp Contacted at on newly-contacted deals
        working-directory: PERBot
        run: npm run job:sponsor-stage-sync
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
