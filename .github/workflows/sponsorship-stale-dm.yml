name: Sponsorship — Wednesday Stale DM

# Wednesday 9am ET: DM each DRI only their own overdue deals, plus deals gone cold
# (Contacted 30+ days, no reply), each asked about once. GitHub cron fires hours
# late on this repo, so the script's gate is "Wednesday, 9am ET or later" and there are
# three triggers (EDT/EST + a catch-up); a Notion ⚙️ Job Log claim makes any extra fire a
# no-op. Silence is valid — members with nothing overdue get no DM.
on:
  schedule:
    - cron: '0 13 * * 3' # 9am EDT
    - cron: '0 14 * * 3' # 9am EST
    - cron: '0 17 * * 3' # catch-up (GitHub cron here fires hours late; gate is ≥9am ET, Job Log dedupes)
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if today is not Wednesday'
        type: boolean
        default: false
      dry_run:
        description: 'Log each DM and skip all writes (Slack, Notion stamps, schema)'
        type: boolean
        default: false

jobs:
  stale-dm:
    runs-on: ubuntu-latest
    concurrency:
      group: sponsor-stale-dm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: DM members their overdue deals
        run: python -m sponsorship.jobs.stale_dm
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          FORCE_STALE_DM: ${{ inputs.force }}
          STALE_DRY_RUN: ${{ inputs.dry_run }}
