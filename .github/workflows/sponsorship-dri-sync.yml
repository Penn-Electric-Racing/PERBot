name: Sponsorship — Hourly DRI Sync

# Keeps PERBot's DRI ledger (`DRI assigned` on each Pipeline deal) in step with the DRI
# people property: stamps newly-added DRIs with the time they were noticed, drops removed
# ones, backfills pre-ledger deals with their creation time. This is what lets the weekly
# quota audit count re-assignments onto older deals. Idempotent — only changed deals are
# written — so late/double cron fires are harmless.
on:
  schedule:
    - cron: '30 * * * *' # hourly, offset from the win-post job
  workflow_dispatch:

jobs:
  dri-sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sponsor-dri-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PERBot/package-lock.json

      - name: Install dependencies
        working-directory: PERBot
        run: npm ci

      - name: Sync the DRI ledger
        working-directory: PERBot
        run: npm run job:sponsor-dri-sync
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
