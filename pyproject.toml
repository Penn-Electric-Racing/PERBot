[project]
name = "perbot"
version = "0.1.0"
description = "Penn Electric Racing's Slack + Notion bot"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "aiohttp>=3.10",
    "openai[aiohttp]>=1.99",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "pypdf>=5.0",
    "mammoth>=1.8",
    # price_check/scrapers (part search for the price listener)
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Code lives at the repo root (no package folder); make it importable from tests.
pythonpath = ["."]
# caplog sees INFO lines too (log assertions check job summaries).
log_level = "INFO"
# Tests are `async def`; each runs on its own event loop.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
